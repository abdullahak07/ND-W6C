<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5fbff">
<title>COMP6013 Week 6 · Secure Network Protocols</title>
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#f8fdff,#eef8fc);color:#123044}.loader{text-align:center;padding:32px}.ring{width:48px;height:48px;border:4px solid #d7e9f0;border-top-color:#0aa9c4;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}.bar{width:min(360px,72vw);height:6px;background:#dcebf1;border-radius:999px;overflow:hidden;margin:18px auto}.bar i{display:block;height:100%;width:45%;background:linear-gradient(90deg,#0aa9c4,#21b889,#6f7de8);animation:load 1.3s ease-in-out infinite}.small{color:#607b8b;font-size:.88rem}@keyframes spin{to{transform:rotate(360deg)}}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(260%)}}</style>
</head>
<body>
<div class="loader"><div class="ring"></div><strong>Loading COMP6013 Week 6</strong><div class="bar"><i></i></div><div class="small">TLS · HTTPS · SSH · interactive games</div></div>
<script type="module">
import siteUrl from './site.bin?url';
(async()=>{
  try{
    if('scrollRestoration' in history) history.scrollRestoration='manual';
    const r=await fetch(siteUrl,{cache:'no-store'});
    if(!r.ok) throw new Error('site payload '+r.status);
    if(typeof DecompressionStream==='undefined') throw new Error('Please use an up-to-date Chrome, Edge, Firefox or Safari browser.');
    const html=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();
    if(!html.includes('HTTPS CASTLE')||!html.includes('HANDSHAKE HERO')||!html.includes('FINAL STUDENT THEME')) throw new Error('Website payload validation failed.');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div class="loader"><strong>Website could not load.</strong><p class="small">'+e.message+'</p></div>';}
})();
</script>
</body>
</html>
