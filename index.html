120px 1fr;gap:8px 10px;align-items:center}.recfig b{color:#3b6072}.recfig span{padding:10px 12px;border:1px solid #d5e5ec;border-radius:10px;background:#f7fbfd;color:#506e7d}.recfig em{grid-column:2;text-align:center;color:#0aa9c4;font-style:normal;font-weight:900}.hsfig{display:grid;gap:8px}.phase{display:grid;grid-template-columns:125px 1fr;gap:10px;padding:11px;border:1px solid #dce9ef;border-radius:11px;background:#fbfdfe}.phase b{color:#17465a}.phase span{color:#607b89}.flow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.flow span{padding:9px 10px;border:1px solid #d7e7ee;border-radius:10px;background:#f7fbfd;font-weight:800;color:#2d576a}.flow i{font-style:normal;color:#0aa9c4;font-weight:900}.tut-done{justify-self:end;border:1px solid #beddd4;background:#edf9f5;color:#168263;border-radius:11px;padding:9px 12px;font-weight:900;cursor:pointer}.tut-done.done{background:#168263;color:#fff}@media(max-width:850px){.tut-steps{grid-template-columns:1fr}.tut-head{grid-template-columns:44px 1fr}.tut-level{grid-column:2}.tut-progress{flex-direction:column;align-items:stretch}.phase{grid-template-columns:1fr}}\n";
const tutorialHTML="\n<section class=\"section\" id=\"tutorial\">\n<div class=\"wrap\">\n<div class=\"head reveal\"><div class=\"unit\">TUTORIAL<br>ACTIVITIES</div><div><h2>Week 6 tutorial activities</h2><p class=\"lead\">Try each activity with a partner first. Then open the worked example to see one good way to answer it.</p></div></div>\n<div class=\"tut-progress reveal\"><b>Tutorial progress</b><div class=\"track\"><i id=\"tutBar\"></i></div><strong id=\"tutText\">0 / 4 complete</strong></div>\n<div class=\"tut-wrap\" style=\"margin-top:16px\">\n\n<article class=\"tut-card reveal\"><div class=\"tut-head\"><div class=\"tut-no\">1</div><div><h3>Web threats, countermeasures and HMAC</h3><p>Identify Web threats and explain how a suitable control reduces each risk.</p></div><span class=\"tut-level\">Simple</span></div>\n<div class=\"tut-body\">\n<div class=\"tut-task\"><b>Activity:</b> In pairs, identify potential threats faced by the Web and possible countermeasures. Review HMAC and explain why it is useful for secure communication.</div>\n<div class=\"tut-steps\"><div class=\"tut-step\"><b>1 · Name the threat</b>Integrity, confidentiality, denial of service, or authentication.</div><div class=\"tut-step\"><b>2 · Explain the impact</b>What does the attacker change, learn, block or impersonate?</div><div class=\"tut-step\"><b>3 · Match a control</b>Choose a countermeasure that directly addresses that problem.</div></div>\n<details class=\"worked\"><summary>View worked example</summary><div>\n<table class=\"ans\"><tr><th>Threat</th><th>Example</th><th>Countermeasure</th></tr><tr><td>Integrity</td><td>Payment data is changed in transit.</td><td>Cryptographic integrity protection such as a MAC/HMAC.</td></tr><tr><td>Confidentiality</td><td>An attacker reads login or form traffic.</td><td>TLS/HTTPS encryption.</td></tr><tr><td>DoS</td><td>Bogus requests overload the server.</td><td>Rate limiting, filtering and upstream DoS protection.</td></tr><tr><td>Authentication</td><td>A fake server impersonates the real site.</td><td>Certificate-based server authentication and correct validation.</td></tr></table>\n<p><b>HMAC example:</b> HMAC combines a secret key with a hash function to produce a tag for a message. The receiver recomputes the tag with the same secret. A changed message should produce a different result, so modification is detectable.</p>\n<p><b>Easy wording:</b> Encryption hides the message; HMAC helps check that it was not changed and that the sender knows the shared secret.</p>\n</div></details><button class=\"tut-done\" data-tut=\"1\">Mark activity complete</button></div></article>\n\n<article class=\"tut-card reveal\"><div class=\"tut-head\"><div class=\"tut-no\">2</div><div><h3>TLS session, connection and Record Protocol</h3><p>Separate session state from connection state, then follow the TLS record-processing flow.</p></div><span class=\"tut-level\">Mediocre</span></div>\n<div class=\"tut-body\">\n<div class=\"tut-task\"><b>Activity:</b> Discuss TLS connection and TLS session, including their state parameters. Then use Figure 1 to explain the TLS Record Protocol.</div>\n<div class=\"tut-steps\"><div class=\"tut-step\"><b>Session</b>A client/server association created by the Handshake Protocol that stores shared security parameters.</div><div class=\"tut-step\"><b>Connection</b>A transient peer-to-peer transport relationship associated with a session.</div><div class=\"tut-step\"><b>Figure 1</b>Read from top to bottom: application data → fragment → compress → MAC → encrypt → header.</div></div>\n<div class=\"tut-fig\"><div class=\"recfig\"><b>Application data</b><span>HTTP/application message</span><em>↓</em><b>Fragment</b><span>Break into manageable blocks</span><em>↓</em><b>Compress</b><span>Optional compression in the course TLS model</span><em>↓</em><b>Add MAC</b><span>Add integrity/authentication value</span><em>↓</em><b>Encrypt</b><span>Protect the fragment</span><em>↓</em><b>TLS header</b><span>Header + protected payload</span></div><div style=\"margin-top:9px;color:#738a96;font-size:.82rem\">Figure 1. TLS Record Protocol.</div></div>\n<details class=\"worked\"><summary>View worked example</summary><div>\n<table class=\"ans\"><tr><th>Session-state examples</th><th>Connection-state examples</th></tr><tr><td>Session identifier</td><td>Client/server random values</td></tr><tr><td>Peer certificate</td><td>Write MAC secrets</td></tr><tr><td>Compression method</td><td>Write encryption keys</td></tr><tr><td>Cipher specification</td><td>Initialization vectors where required</td></tr><tr><td>Master secret; resumable flag</td><td>Sequence numbers</td></tr></table>\n<p><b>Record example:</b> A browser form becomes TLS application data. TLS fragments it, optionally compresses it in the model shown here, adds a MAC, encrypts the protected fragment and appends the TLS record header. TCP then carries the record.</p>\n</div></details><button class=\"tut-done\" data-tut=\"2\">Mark activity complete</button></div></article>\n\n<article class=\"tut-card reveal\"><div class=\"tut-head\"><div class=\"tut-no\">3</div><div><h3>Four phases of the TLS handshake</h3><p>Summarise what each phase does and explain why that phase matters.</p></div><span class=\"tut-level\">Mediocre</span></div>\n<div class=\"tut-body\">\n<div class=\"tut-task\"><b>Activity:</b> In pairs, summarise the four phases of the TLS handshake and explain why each phase is important for secure communication.</div>\n<div class=\"tut-fig\"><div class=\"hsfig\"><div class=\"phase\"><b>Phase 1 · Capabilities</b><span>client_hello ⇄ server_hello — agree protocol version, session information, cipher suite, compression method and random values.</span></div><div class=\"phase\"><b>Phase 2 · Server</b><span>certificate*, server_key_exchange*, certificate_request*, server_hello_done — server supplies authentication/key-exchange information.</span></div><div class=\"phase\"><b>Phase 3 · Client</b><span>certificate*, client_key_exchange, certificate_verify* — client contributes key material and may prove its identity.</span></div><div class=\"phase\"><b>Phase 4 · Finish</b><span>change_cipher_spec + finished in both directions — activate and verify the negotiated secure state.</span></div></div><div style=\"margin-top:9px;color:#738a96;font-size:.82rem\">Figure 2. Four phases of the TLS handshake. * Optional or situation-dependent in the course figure.</div></div>\n<details class=\"worked\"><summary>View worked example</summary><div>\n<table class=\"ans\"><tr><th>Phase</th><th>Why it matters</th></tr><tr><td>1 · Establish capabilities</td><td>Both sides must agree on compatible security parameters before protection can begin.</td></tr><tr><td>2 · Server authentication/key exchange</td><td>The client receives information needed to authenticate the server and establish shared key material.</td></tr><tr><td>3 · Client authentication/key exchange</td><td>The client contributes key-exchange material and, when required, proves its own identity.</td></tr><tr><td>4 · Finish</td><td>Both sides activate the negotiated state and verify that the handshake succeeded before trusting application data.</td></tr></table>\n<p><b>One-sentence answer:</b> The handshake agrees the security rules, authenticates parties as required, establishes cryptographic keys, then confirms both sides created the same secure state.</p>\n</div></details><button class=\"tut-done\" data-tut=\"3\">Mark activity complete</button></div></article>\n\n<article class=\"tut-card reveal\"><div class=\"tut-head\"><div class=\"tut-no\">4</div><div><h3>Design a secure Web communication workflow</h3><p>Combine TLS, HTTPS and SSH, then identify risks that secure transport does not remove.</p></div><span class=\"tut-level\">Open-ended · Optional</span></div>\n<div class=\"tut-body\">\n<div class=\"tut-task\"><b>Activity:</b> Design a secure communication workflow for a Web application using TLS, HTTPS and SSH. Explain how each protocol contributes to overall security and identify potential weaknesses.</div>\n<div class=\"tut-steps\"><div class=\"tut-step\"><b>1 · Draw actors</b>Browser/user, Web server, administrator and the network.</div><div class=\"tut-step\"><b>2 · Place protocols</b>HTTPS/TLS for normal Web traffic; SSH for protected administration.</div><div class=\"tut-step\"><b>3 · Add remaining risks</b>Secure transport does not fix vulnerable application code, stolen credentials or compromised endpoints.</div></div>\n<details class=\"worked\"><summary>View worked example</summary><div>\n<div class=\"flow\"><span>User browser</span><i>— HTTPS/TLS →</i><span>Web server</span><i>← SSH —</i><span>Administrator</span></div>\n<p><b>Browser → Web server:</b> HTTPS carries HTTP inside TLS. TLS authenticates the server, negotiates keys, encrypts the HTTP data and protects integrity.</p>\n<p><b>Administrator → Web server:</b> SSH provides protected remote administration with server authentication, encrypted transport, integrity and user authentication.</p>\n<p><b>Remaining weaknesses:</b> SQL injection or other vulnerable Web code, stolen user passwords, certificate-validation mistakes, stolen SSH private keys, weak endpoint security, and a fully compromised server can still expose data before encryption or after decryption.</p>\n<p><b>Good answer format:</b> Draw the workflow, label each connection, write one sentence for what each protocol protects, then list at least three remaining risks.</p>\n</div></details><button class=\"tut-done\" data-tut=\"4\">Mark activity complete</button></div></article>\n\n</div></div></section>\n";
const tutorialJS="\nconst tutDone=new Set(JSON.parse(localStorage.getItem(\"w6TutDone\")||\"[]\"));\nfunction paintTut(){ $$(\".tut-done\").forEach(b=>{let d=tutDone.has(b.dataset.tut);b.classList.toggle(\"done\",d);b.textContent=d?\"✓ Activity complete\":\"Mark activity complete\"});let n=tutDone.size;if($(\"#tutBar\"))$(\"#tutBar\").style.width=(n*25)+\"%\";if($(\"#tutText\"))$(\"#tutText\").textContent=n+\" / 4 complete\"}\n$$(\".tut-done\").forEach(b=>b.onclick=()=>{let id=b.dataset.tut;tutDone.has(id)?tutDone.delete(id):(tutDone.add(id),sGood());localStorage.setItem(\"w6TutDone\",JSON.stringify([...tutDone]));paintTut()});paintTut();\n";
